name: Build Dalny

on:
  push:
  workflow_dispatch:
    inputs:
      universal:
        description: Also build arm64 and lipo a universal app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dalny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checks
        run: bash scripts/check-tree.sh

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        env:
          DALNY_UNIVERSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.universal && '1' || '0' }}
        run: bash scripts/build-macos.sh

      - name: Upload Dalny.app
        uses: actions/upload-artifact@v4
        with:
          name: Dalny-macos
          path: dist/Dalny-macos.zip
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          echo "short=$(tr -d '\n' < dist/version-short.txt)" >> "$GITHUB_OUTPUT"
          echo "build=$(tr -d '\n' < dist/version-build.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Дальний ${{ steps.ver.outputs.short }} (${{ steps.ver.outputs.build }})
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/Dalny-macos.zip
          body: |
            CFBundleShortVersionString: ${{ steps.ver.outputs.short }}
            CFBundleVersion: ${{ steps.ver.outputs.build }}
